name: Build UbiDooby Modern FPS Update

on:
  push:
    branches:
      - ubidooby-modern-fps-update-rafs-external-texture-support
  workflow_dispatch:

concurrency:
  group: ubidooby-modern-fps-release
  cancel-in-progress: false

jobs:
  build-windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-cmake
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build 64-bit Windows executable
        run: cmake -G"Unix Makefiles" -Bbuild . && cmake --build build -j
      - name: Package download
        run: |
          # Windows keeps user data next to the executable.
          mkdir -p UbiDooby-Modern-FPS-Windows-x64/data/ext_tex
          cp build/pd.x86_64.exe UbiDooby-Modern-FPS-Windows-x64/
          cp /mingw64/bin/{SDL2.dll,zlib1.dll,libwinpthread-1.dll,libgcc_s_seh-1.dll} UbiDooby-Modern-FPS-Windows-x64/
          cp docs/RELEASE-README.md UbiDooby-Modern-FPS-Windows-x64/README.md
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: UbiDooby-Modern-FPS-Windows-x64
          path: UbiDooby-Modern-FPS-Windows-x64/

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gcc g++ make libsdl2-dev zlib1g-dev libsdl2-2.0-0 cmake
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build 64-bit Linux executable
        run: cmake -G"Unix Makefiles" -Bbuild . && cmake --build build -j
      - name: Package download
        run: |
          # Linux keeps user data next to the executable.
          mkdir -p UbiDooby-Modern-FPS-Linux-x64/data/ext_tex
          cp build/pd.x86_64 UbiDooby-Modern-FPS-Linux-x64/
          cp docs/RELEASE-README.md UbiDooby-Modern-FPS-Linux-x64/README.md
          tar cJf UbiDooby-Modern-FPS-Linux-x64.tar.xz UbiDooby-Modern-FPS-Linux-x64
      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: UbiDooby-Modern-FPS-Linux-x64
          path: UbiDooby-Modern-FPS-Linux-x64.tar.xz

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Install dependencies
        run: |
          brew install zlib
          wget http://libsdl.org/release/SDL2-2.30.9.dmg -O SDL2.dmg
          hdiutil mount SDL2.dmg
          sudo cp -vr /Volumes/SDL2/SDL2.framework /Library/Frameworks
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Apple-silicon Mac executable
        run: |
          cmake -G"Unix Makefiles" -Bbuild -DCMAKE_OSX_ARCHITECTURES=arm64 .
          cmake --build build --target pd -j4 --clean-first
      - name: Package download
        run: |
          BUNDLE_DIR='UbiDooby-Modern-FPS-macOS-Apple-Silicon'
          APP_DIR="$BUNDLE_DIR/Perfect Dark.app"
          SDL_FRAMEWORK="$APP_DIR/Contents/Frameworks/SDL2.framework"
          # macOS keeps user data outside the signed app bundle. The launcher
          # creates ~/Library/Application Support/perfectdark/data/ext_tex.
          mkdir -p "$APP_DIR/Contents/MacOS" "$SDL_FRAMEWORK/Versions"
          clang -fobjc-arc -arch arm64 -mmacosx-version-min=11.0 .github/scripts/macos-app-launcher.m -framework Cocoa -o "$APP_DIR/Contents/MacOS/Perfect Dark"
          install_name_tool -add_rpath '@executable_path/../Frameworks' build/pd.arm64
          codesign --force --sign - build/pd.arm64
          cp build/pd.arm64 "$APP_DIR/Contents/MacOS/"
          cp -R /Library/Frameworks/SDL2.framework/Versions/A "$SDL_FRAMEWORK/Versions/"
          ln -s A "$SDL_FRAMEWORK/Versions/Current"
          ln -s Versions/Current/SDL2 "$SDL_FRAMEWORK/SDL2"
          ln -s Versions/Current/Headers "$SDL_FRAMEWORK/Headers"
          ln -s Versions/Current/Resources "$SDL_FRAMEWORK/Resources"
          cp docs/RELEASE-README.md "$BUNDLE_DIR/README.md"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0"><dict><key>CFBundleExecutable</key><string>Perfect Dark</string><key>CFBundleIdentifier</key><string>com.ubidoobybanooby.perfectdark</string><key>CFBundleName</key><string>Perfect Dark</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>Modern FPS Update</string><key>LSMinimumSystemVersion</key><string>11.0</string></dict></plist>' > "$APP_DIR/Contents/Info.plist"
          codesign --force --sign - "$SDL_FRAMEWORK"
          codesign --force --sign - "$APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          zip -r -y UbiDooby-Modern-FPS-macOS-Apple-Silicon.zip UbiDooby-Modern-FPS-macOS-Apple-Silicon
      - name: Upload Mac bundle
        uses: actions/upload-artifact@v4
        with:
          name: UbiDooby-Modern-FPS-macOS-Apple-Silicon
          path: UbiDooby-Modern-FPS-macOS-Apple-Silicon.zip

  publish-release:
    needs: [build-windows-x64, build-linux-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: UbiDooby-Modern-FPS-Windows-x64
          path: release-files/UbiDooby-Modern-FPS-Windows-x64
      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: UbiDooby-Modern-FPS-Linux-x64
          path: release
      - name: Download Mac bundle
        uses: actions/download-artifact@v4
        with:
          name: UbiDooby-Modern-FPS-macOS-Apple-Silicon
          path: release
      - name: Create release files
        run: |
          mkdir -p release
          cd release-files
          zip -r ../release/UbiDooby-Modern-FPS-Windows-x64.zip UbiDooby-Modern-FPS-Windows-x64
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ubidooby-modern-fps-latest
        run: |
          git tag --force "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"
          gh release view "$TAG" || gh release create "$TAG" --title "UbiDooby Modern FPS Update + Rafccq External Texture Support" --notes "Latest automated desktop builds for the UbiDooby Modern FPS Update + Rafccq External Texture Support branch. ROMs and texture packs are not included."
          gh release upload "$TAG" release/* --clobber
